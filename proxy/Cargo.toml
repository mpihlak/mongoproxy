[package]
name = "mongoproxy"
version = "0.7.0"
authors = ["mpihlak <martin.pihlak@starship.co>"]
edition = "2018"

[dependencies]
byteorder = '1.3'
hyper = { version = "1.12", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
prometheus = '0.14'
lazy_static = '1.4'
clap = { version = "4.6", features = ["cargo"] }
libc = '0.2'
bson = '3.1'
tokio = { version = "1.34", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time" ] }
tokio-stream = '0.1'
bytes = '1.0'
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic"] }
mongo-protocol = { path="../mongo-protocol" }
async-bson = { path="../async-bson" }
regex = { version = "1.8.1", features = ["unicode-case"] }
tracing-test = "0.2.5"
