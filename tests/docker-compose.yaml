version: "3"
services:
  mongoproxy:
    container_name: mongoproxy-i9n-test
    image: mongoproxy
    environment:
      - RUST_BACKTRACE=1
      - RUST_LOG=info
    command: ./mongoproxy --proxy 27111:mongodb-i9n-test:27017 --enable-otlp --otlp-endpoint http://otel-collector-i9n-test:4317 --log-mongo-messages
    ports:
      - "9898:9898"
      - "27111:27111"
  mongodb:
    container_name: mongodb-i9n-test
    image: mongo
    logging:
      driver: none
    ports:
      - "27017:27017"
  prometheus:
    container_name: prometheus-i9n-test
    image: prom/prometheus
    logging:
      driver: none
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  otel-collector:
    container_name: otel-collector-i9n-test
    image: otel/opentelemetry-collector:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml
  jaeger:
    container_name: jaeger-i9n-test
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
